[PHP]
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
log_errors = On
error_log = /var/log/php/php_errors.log

[Date]
; Ajuste conforme o ambiente (dev usa o mesmo TZ do host via env TZ dos containers)
date.timezone = "UTC"

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

[Xdebug]
; Efetivo apenas quando a imagem foi buildada com PHP_ENABLE_XDEBUG=true.
; O modo em runtime vem da env XDEBUG_MODE (var XDEBUG_ENABLE do .env).
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; --- Limites de upload e execucao ---
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
