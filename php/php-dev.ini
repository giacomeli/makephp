[PHP]
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
log_errors = On
error_log = /var/log/php/php_errors.log

[Date]
; Adjust per environment (dev containers receive the host TZ via the TZ env)
date.timezone = "UTC"

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

[Xdebug]
; Effective only when the image was built with PHP_ENABLE_XDEBUG=true.
; The runtime mode comes from the XDEBUG_MODE env (XDEBUG_ENABLE in .env).
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; --- Upload and execution limits ---
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
