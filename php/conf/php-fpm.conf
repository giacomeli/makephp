[global]
; Número máximo de processos
process.max = 128
error_log = /proc/self/fd/2
daemonize = no

[www]
; Definições de pool para o PHP-FPM
user = www-data
group = www-data

; Gerenciamento de processos: ajuste para 'dynamic' ou 'ondemand' conforme necessário
pm = dynamic
pm.max_children = 20 ; Número máximo de processos filhos simultâneos
pm.start_servers = 5 ; Número inicial de servidores a serem iniciados
pm.min_spare_servers = 2 ; Número mínimo de servidores ociosos
pm.max_spare_servers = 10 ; Número máximo de servidores ociosos
pm.process_idle_timeout = 30s; Tempo antes de encerrar processos ociosos, ajustado para menor frequência de encerramento
pm.max_requests = 500 ; Número de requisições antes de reiniciar o processo

; Log de requisições lentas
request_slowlog_timeout = 2s ; Tempo reduzido para capturar scripts levemente lentos
slowlog = /proc/self/fd/2 ; Log de requisições lentas para saída padrão (Docker)

; Saída padrão de erros e logs para o Docker
catch_workers_output = yes
access.format = "%R - %u %t \"%m %r\" %s %f cpu:%C%% mem:%M%% req:%d ms"
