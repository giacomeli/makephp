##### PREFIX #####
# Mantém o Ctrl+b como prefixo padrão
set-option -g prefix C-b
bind r source-file ~/.tmux.conf \; display "Reloaded!"

##### INTERFACE E COMPORTAMENTO #####
# Ativa o mouse para selecionar, mover e redimensionar painéis
set -g mouse on

# Ativa rolagem com Shift + PageUp/PageDown ou scroll do mouse
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Ativa renomeação automática de janelas
set-option -g allow-rename on

# Mostra painéis com bordas coloridas
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Suporte ao Powerline/p10k com fontes nerd fonts
set -g status-bg colour234
set -g status-fg colour137
set -g status-left-length 60
set -g status-right-length 120
set -g status-interval 5

# Exibe informações no status
set -g status-left '#[fg=colour40]#S #[fg=colour240]|'
set -g status-right '#[fg=colour244]#(whoami)@#H #[fg=colour240]| #[fg=colour246]%Y-%m-%d %H:%M'

# Nome automático das janelas baseado no comando atual
setw -g automatic-rename on

# Histórico mais longo
set-option -g history-limit 100000

# Ativa números nas janelas (Ctrl+b 1, 2, etc.)
setw -g monitor-activity on
set -g visual-activity on

##### ATAJOS ÚTEIS #####
# Split horizontal e vertical
bind - split-window -v
bind \ split-window -h

# Navegar entre painéis com vim-like (Ctrl+b + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alternar entre último painel usado
bind Tab last-pane

# Facilita fechar painel com x
bind x kill-pane

# Reload com mensagem
bind r source-file ~/.tmux.conf \; display-message "🌀 Configuração recarregada"

##### CORES E FONTES (NERD FONTS) #####
set -g message-style fg=colour231,bg=colour237
set -g message-command-style fg=colour231,bg=colour237

# Terminal compatível
set -g default-terminal "screen-256color"

# Usa UTF-8 e impede bugs de formatação
set -g utf8 on