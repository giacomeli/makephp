[PHP]
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/php_errors.log
expose_php = Off

[Date]
date.timezone = "UTC"

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Producao: nao revalidar timestamps — deploy exige reload do FPM
; (docker compose restart <app> ou kill -USR2 no master)
opcache.validate_timestamps=0

; --- Limites de upload e execucao ---
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
