services:
  php-fpm:
    restart: unless-stopped
    image: ${PHP_CONTAINER_NAME}:${PHP_IMAGE_TAG}
    build:
      context: ./php
      dockerfile: Dockerfile
      target: final
      args:
        PHP_ENABLE_SWOOLE: ${PHP_ENABLE_SWOOLE}
        PHP_ENABLE_XDEBUG: ${PHP_ENABLE_XDEBUG}
    container_name: ${PHP_CONTAINER_NAME}
    working_dir: ${DOCKER_PROJECT_PATH}
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ${LOCAL_DIR}:${DOCKER_PROJECT_PATH}
      - ./php/php-dev.ini:/usr/local/etc/php/php.ini
      - ./logs/php:/var/log/php
    networks:
      phpdocker-network:
        aliases:
          - ${PHP_ALIASES}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      XDEBUG_MODE: ${XDEBUG_ENABLE}

  nginx:
    image: nginx:1.29-alpine
    container_name: ${NGINX_CONTAINER_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${NGINX_PORT_HTTP}:80"
      - "${NGINX_PORT_HTTPS}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/includes/:/etc/nginx/includes/:ro
      - ${LOCAL_DIR}:${DOCKER_PROJECT_PATH}
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - fastcgi-cache:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
    networks:
      phpdocker-network:
        aliases:
          - ${NGINX_ALIASES}
    depends_on:
      php-fpm:
        condition: service_healthy
    environment:
      TZ: ${TZ}

  certbot:
    build:
      context: ./certbot
    container_name: certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - nginx

  mariadb:
    build:
      context: ./mariadb
      args:
        TZ: ${TZ}
    container_name: ${MARIADB_CONTAINER_NAME}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MARIADB_PORT}:3306"
    networks:
      phpdocker-network:
        aliases:
          - ${MARIADB_ALIASES}

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    container_name: ${REDIS_CONTAINER_NAME}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    networks:
      phpdocker-network:
        aliases:
          - ${REDIS_ALIASES}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}

  mongodb:
    image: mongo:6.0
    container_name: ${MONGODB_CONTAINER_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${MONGODB_PORT}:27017"
    environment:
      TZ: ${TZ}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      phpdocker-network:
        aliases:
          - ${MONGODB_ALIASES}
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4-management
    container_name: ${RABBITMQ_CONTAINER_NAME}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      phpdocker-network:
        aliases:
          - ${RABBITMQ_ALIASES}
  postgres-timescale:
    image: timescale/timescaledb:2.28.3-pg15
    container_name: ${POSTGRES_TIMESCALE_CONTAINER_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_TIMESCALE_PORT}:5432"
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_TIMESCALE_DATABASE}
      POSTGRES_USER: ${POSTGRES_TIMESCALE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TIMESCALE_PASSWORD}
    volumes:
      - postgres_timescale_data:/var/lib/postgresql/data
    networks:
      phpdocker-network:
        aliases:
          - ${POSTGRES_TIMESCALE_ALIASES}
networks:
  phpdocker-network:
    external: true
    name: phpdocker-network

volumes:
  rabbitmq_data:
  mariadb_data:
  fastcgi-cache:
  postgres_timescale_data:
  certbot_certs:
  certbot_webroot:
  mongodb_data: