# Security headers compartilhados.
# IMPORTANTE: pela regra de heranca do nginx, qualquer contexto que declare um
# add_header proprio descarta os herdados — por isso este arquivo e incluido
# tanto no server block quanto nos locations que declaram add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
