# Shared security headers.
# IMPORTANT: due to nginx inheritance rules, any context declaring its own
# add_header discards the inherited ones — that is why this file is included
# both in server blocks and in locations that declare add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
