user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 4096;
	multi_accept on;
	use epoll;
}

http {
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 20;
	types_hash_max_size 4096;
	client_max_body_size 20M;

	# Request buffers (tuned)
	client_body_buffer_size 8k;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 8k;
	output_buffers 2 32k;
	postpone_output 1460;

	# Open file cache
	open_file_cache max=10000 inactive=20s;
	open_file_cache_valid 30s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	# FastCGI cache for PHP-FPM
	fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=FASTCGI_CACHE:10m inactive=60m;
	fastcgi_cache_key "$scheme$request_method$host$request_uri";
	fastcgi_cache_use_stale error timeout updating;
	fastcgi_cache_valid 200 302 10m;
	fastcgi_cache_valid 404 1m;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr;

	# Gzip configuration
	gzip on;
	gzip_disable "msie6";
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
	application/atom+xml
	application/javascript
	application/json
	application/rss+xml
	application/vnd.ms-fontobject
	application/x-font-ttf
	application/x-web-app-manifest+json
	application/xhtml+xml
	application/xml
	font/opentype
	image/svg+xml
	image/x-icon
	text/css
	text/plain
	text/x-component;

	# SSL configuration
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
	ssl_prefer_server_ciphers on;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	# Global security headers
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# FastCGI buffers (tuned)
	fastcgi_buffering on;
	fastcgi_buffer_size 8k;
	fastcgi_buffers 8 8k;
	fastcgi_busy_buffers_size 48k;
	fastcgi_temp_file_write_size 64k;

	# Catch-all: unknown hosts get no content
	server {
		listen 80 default_server;
		server_name _;

		# Internal healthcheck endpoint (docker compose)
		location = /healthz {
			access_log off;
			return 200;
		}

		location / {
			return 444;
		}
	}

	# TLS catch-all: unknown SNI gets no site certificate
	server {
		listen 443 ssl default_server;
		server_name _;
		ssl_reject_handshake on;
	}

	include /etc/nginx/conf.d/*.conf;

	# Charset
	charset UTF-8;
}
