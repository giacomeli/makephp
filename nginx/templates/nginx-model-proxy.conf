# generated-by: makephp
server {
    listen 80;
    server_name __SERVER_NAME__;

    include /etc/nginx/includes/security-headers.conf;

    # Docker internal DNS + variable proxy_pass: resolution happens per
    # request, not at config load — nginx starts (and nginx -t passes)
    # even when the app container is down.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://__APP_NAME__:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass $upstream;
    }
}
