# generated-by: makephp
server {
    listen 80;
    server_name __SERVER_NAME__;
    root __ROOT_PATH__;
    index index.php index.html index.htm;

    include /etc/nginx/includes/security-headers.conf;

    # Nao cachear respostas de sessoes autenticadas
    set $skip_cache 0;
    if ($http_cookie ~* "laravel_session|wordpress_logged_in|PHPSESSID") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Rota exclusiva para o desafio do Let's Encrypt
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass __PHP_UPSTREAM__;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_cache FASTCGI_CACHE;
        fastcgi_cache_valid 200 302 10m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-FastCGI-Cache $upstream_cache_status;
        include /etc/nginx/includes/security-headers.conf;
    }

    error_log /var/log/nginx/__APP_NAME___error.log;
    access_log /var/log/nginx/__APP_NAME___access.log;
}
